name: Release Node SDK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: ./openplatform-sdk/node
        run: npm ci

      - name: Build
        working-directory: ./openplatform-sdk/node
        run: npm run build

      - name: Run tests
        working-directory: ./openplatform-sdk/node
        run: npm run test:unit

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clean working directory
        run: |
          git checkout -- package-lock.json 2>/dev/null || true
          git clean -fd 2>/dev/null || true

      # `release` events fire for every published release in this repo (Java and
      # web included), and GitHub ignores a `tags:` filter on `release`. Gate the
      # version/publish steps on the tag name so a Java release never reaches
      # `npm publish`.
      - name: Get version from release tag
        if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'node-sdk-v')
        working-directory: ./openplatform-sdk/node
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION=${TAG#node-sdk-v}
          VERSION=${VERSION#v}
          echo "Extracted version: $VERSION"
          # Use --allow-same-version to avoid error when version matches
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        working-directory: ./openplatform-sdk/node
        run: npm version ${{ inputs.bump }}

      - name: Publish to npm
        if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'node-sdk-v')
        working-directory: ./openplatform-sdk/node
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version commit and tag
        if: github.event_name == 'workflow_dispatch'
        run: git push --follow-tags
