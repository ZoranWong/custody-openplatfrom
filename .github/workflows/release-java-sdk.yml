name: Release Java SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version
        working-directory: ./openplatform-sdk/java
        run: |
          mvn versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Build and package
        working-directory: ./openplatform-sdk/java
        run: mvn clean package -DskipTests

      - name: Commit version and create tag
        run: |
          git add openplatform-sdk/java/
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping commit"
          else
            git commit -m "chore: release Java SDK v${{ inputs.version }}"
          fi
          git tag -a java-sdk-v${{ inputs.version }} -m "Java SDK release ${{ inputs.version }}" || echo "Tag already exists"
          git push origin main --tags || git push origin --tags
