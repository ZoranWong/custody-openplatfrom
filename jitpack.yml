jdk:
  - openjdk21
# Build only the core module from the java subdirectory.
#
# Notes for this monorepo:
#  * `mvn` from the JitPack image is too old for javadoc-plugin 3.7.0. The
#    javadoc jar is bound to the `release` profile only (Maven Central needs
#    it), so the default build on JitPack does not touch that plugin.
#  * Prefer the image Maven over ./mvnw: the wrapper re-downloads apache-maven
#    from repo.maven.apache.org, which intermittently yields a corrupt zip on
#    JitPack and fails before the build starts.
install:
  - cd openplatform-sdk/java && mvn -B clean install -DskipTests -pl cregis-sdk-core -am
