<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cregis SDK Demo - 授权测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #00be78 0%, #00a06a 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .content {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #00be78;
    }

    .form-group input[readonly] {
      background: #f9fafb;
      color: #6b7280;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #00be78;
      color: white;
    }

    .btn-primary:hover {
      background: #00a06a;
      transform: translateY(-2px);
    }

    .btn-primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #6b7280;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .btn-secondary:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .result {
      margin-top: 24px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result.success {
      background: #d1fae5;
      border: 1px solid #34d399;
      color: #065f46;
    }

    .result.error {
      background: #fee2e2;
      border: 1px solid #f87171;
      color: #991b1b;
    }

    .result.cancelled {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
    }

    .result h3 {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .result pre {
      background: rgba(0, 0, 0, 0.1);
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }

    .status {
      margin-top: 20px;
      padding: 16px;
      background: #f9fafb;
      border-radius: 8px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .status-item:last-child {
      border-bottom: none;
    }

    .status-label {
      color: #6b7280;
      font-size: 14px;
    }

    .status-value {
      font-weight: 600;
      font-size: 14px;
    }

    .status-value.success {
      color: #00be78;
    }

    .status-value.pending {
      color: #f59e0b;
    }

    .status-value.error {
      color: #ef4444;
    }

    .note {
      margin-top: 20px;
      padding: 12px;
      background: #fef3c7;
      border-radius: 8px;
      font-size: 12px;
      color: #92400e;
      line-height: 1.6;
    }

    .note code {
      background: rgba(0, 0, 0, 0.08);
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Cregis SDK Demo</h1>
      <p>钱包授权测试 - Wallet Authorization Test</p>
    </div>

    <div class="content">
      <div class="form-group">
        <label>App ID</label>
        <input type="text" id="appId" placeholder="输入 App ID（UUID 格式）">
      </div>

      <div class="form-group">
        <label>App Secret</label>
        <input type="password" id="appSecret" placeholder="输入 App Secret">
      </div>

      <div class="form-group">
        <label>Base URL（开放平台地址）</label>
        <input type="text" id="baseUrl" value="http://localhost:1002" placeholder="默认: http://localhost:1002">
      </div>

      <div class="form-group">
        <label>显示模式</label>
        <select id="mode">
          <option value="popup" selected>弹框模式 (popup)</option>
          <option value="tab">新标签页 (tab)</option>
          <option value="window">弹窗窗口 (window)</option>
        </select>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="getAuthUrlBtn">获取 authorizeUrl</button>
        <button class="btn btn-primary" id="openAuthBtn" disabled>打开授权</button>
        <button class="btn btn-secondary" id="closeBtn" disabled>关闭授权</button>
      </div>

      <div class="form-group" style="margin-top: 20px;">
        <label>Authorize URL（自动填入）</label>
        <input type="text" id="authorizeUrlDisplay" placeholder="获取成功后自动填入" readonly>
      </div>

      <div class="result" id="result"></div>

      <div class="status" id="status">
        <div class="status-item">
          <span class="status-label">SDK 状态</span>
          <span class="status-value pending" id="sdkStatus">未初始化</span>
        </div>
        <div class="status-item">
          <span class="status-label">授权状态</span>
          <span class="status-value pending" id="authStatus">等待授权</span>
        </div>
        <div class="status-item">
          <span class="status-label">Authorize ID</span>
          <span class="status-value" id="authorizeId">-</span>
        </div>
      </div>

      <div class="note">
        <strong>使用说明：</strong><br>
        1. 输入 App ID 和 App Secret<br>
        2. 点击"获取 authorizeUrl"调用开放平台接口<br>
        3. 点击"打开授权"完成钱包授权<br>
        4. 注意：appSecret 是应用密钥，生产环境应通过后端代理获取
      </div>
    </div>
  </div>

  <!-- 引入 md5 库（在 module script 之前加载） -->
  <script src="./node_modules/js-md5/build/md5.min.js"></script>

  <!-- 主要逻辑 -->
  <script type="module">
    import { CregisWebSDK } from './dist/index.es.js';


    // ============================================================
    // 状态变量
    // ============================================================
    let sdk = null;
    let currentAuthorizeUrl = null;
    let isAuthorizing = false;

    // ============================================================
    // DOM 元素
    // ============================================================
    const getAuthUrlBtn = document.getElementById('getAuthUrlBtn');
    const openAuthBtn = document.getElementById('openAuthBtn');
    const closeBtn = document.getElementById('closeBtn');
    const result = document.getElementById('result');
    const sdkStatus = document.getElementById('sdkStatus');
    const authStatus = document.getElementById('authStatus');
    const authorizeIdEl = document.getElementById('authorizeId');
    const authorizeUrlDisplay = document.getElementById('authorizeUrlDisplay');

    // ============================================================
    // 签名工具函数
    // ============================================================

    /**
     * 递归排序对象的 key
     */
    function sortKeys(obj) {
      if (obj === null || obj === undefined) {
        return obj;
      }
      const sorted = {};
      const keys = Object.keys(obj).sort();
      for (const key of keys) {
        const value = obj[key];
        if (value !== null && value !== undefined) {
          if (typeof value === 'object' && !Array.isArray(value)) {
            sorted[key] = sortKeys(value);
          } else {
            sorted[key] = value;
          }
        }
      }
      return sorted;
    }

    /**
     * 生成随机 nonce
     */
    function generateNonce(length = 32) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    /**
     * 计算 Basic 签名（用于 /oauth/* 接口）
     * 公式: MD5(appSecret + appId + timestamp + nonce + MD5(JSON.stringify(sortKeys(business))))
     */
    function calculateBasicSignature({ appId, appSecret, timestamp, nonce, business }) {
      const md5 = window.md5;
      if (typeof md5 !== 'function') {
        throw new Error('MD5 library not loaded. Please ensure md5.min.js is available.');
      }
      const serializedBusiness = JSON.stringify(sortKeys(business));
      const businessMd5 = md5(serializedBusiness);
      const signString = `${appId}${timestamp}${nonce}${businessMd5}`;
      const signature = md5(`${appSecret}${signString}`);
      return signature;
    }

    // ============================================================
    // API 调用
    // ============================================================

    /**
     * 调用开放平台获取 authorizeUrl
     * POST {baseUrl}/api/thirdparty/oauth/authorizeUrl
     */
    async function fetchAuthorizeUrl(appId, appSecret, baseUrl) {
      const timestamp = Math.floor(Date.now() / 1000); // 秒级时间戳
      const nonce = generateNonce();
      const business = {
        permissions: [],
        redirectUri: '',
        state: crypto.randomUUID ? crypto.randomUUID() : generateNonce(16),
      };

      const signature = calculateBasicSignature({
        appId,
        appSecret,
        timestamp,
        nonce,
        business,
      });

      const basic = {
        appId,
        timestamp,
        nonce,
        signature,
      };

      // Add timeout via AbortController (15s)
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      try {
        const response = await fetch(`${baseUrl}/api/thirdparty/oauth/authorizeUrl`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ basic, business }),
          signal: controller.signal,
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errorText}`);
        }

        const data = await response.json();

        // Response format: { code: 0, message: "Success", data: { authorizeUrl, expiresIn } }
        // or directly: { authorizeUrl, expiresIn }
        if (data.data && data.data.authorizeUrl) {
          return data.data;
        }
        if (data.authorizeUrl) {
          return data;
        }
        throw new Error('响应中未找到 authorizeUrl');
      } finally {
        clearTimeout(timeoutId);
      }
    }

    // ============================================================
    // UI 辅助函数
    // ============================================================

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showResult(type, message, data) {
      result.className = 'result show ' + type;
      result.innerHTML = `
        <h3>${type === 'success' ? '成功' : type === 'error' ? '错误' : '已取消'}</h3>
        <p>${escapeHtml(message)}</p>
        ${data ? '<pre>' + JSON.stringify(data, null, 2) + '</pre>' : ''}
      `;
    }

    function updateStatus(element, text, type) {
      element.textContent = text;
      element.className = 'status-value ' + (type || '');
    }

    // ============================================================
    // SDK 管理
    // ============================================================

    function initSDK(mode) {
      if (sdk) {
        sdk.destroy();
        sdk = null;
      }

      sdk = new CregisWebSDK({
        container: 'body',
        mode: mode,
        debug: true,
        onReady: ({ uuid }) => {
          console.log('SDK 已就绪, UUID:', uuid);
          updateStatus(sdkStatus, '已就绪', 'success');
        },
        onAuthorizationStarted: () => {
          console.log('授权流程已开始');
          updateStatus(authStatus, '授权中...', 'pending');
          closeBtn.disabled = false;
        },
        onAuthorizationComplete: ({ authorizeId }) => {
          console.log('授权完成:', { authorizeId });
          updateStatus(authStatus, '已授权', 'success');
          authorizeIdEl.textContent = authorizeId || '-';
          showResult('success', '授权成功！', { authorizeId });
        },
        onAuthorizationError: (error) => {
          console.error('授权错误:', error);
          updateStatus(authStatus, '失败', 'error');
          showResult('error', error.message || '授权失败', error);
        },
        onAuthorizationCancelled: () => {
          console.log('授权已取消');
          updateStatus(authStatus, '已取消', 'pending');
          showResult('cancelled', '用户取消了授权');
        },
      });

      updateStatus(sdkStatus, '已初始化', 'success');
    }

    // ============================================================
    // 事件处理
    // ============================================================

    // 获取 authorizeUrl
    getAuthUrlBtn.addEventListener('click', async () => {
      const appId = document.getElementById('appId').value.trim();
      const appSecret = document.getElementById('appSecret').value.trim();
      const baseUrl = document.getElementById('baseUrl').value.trim() || 'http://localhost:1002';

      if (!appId || !appSecret) {
        showResult('error', '请输入 App ID 和 App Secret');
        return;
      }

      getAuthUrlBtn.disabled = true;
      getAuthUrlBtn.textContent = '获取中...';
      result.className = 'result';

      try {
        const data = await fetchAuthorizeUrl(appId, appSecret, baseUrl);
        currentAuthorizeUrl = data.authorizeUrl;
        authorizeUrlDisplay.value = currentAuthorizeUrl;

        openAuthBtn.disabled = false;
        showResult('success', `authorizeUrl 获取成功！有效期 ${data.expiresIn || 7200} 秒`, {
          expiresIn: data.expiresIn,
          authorizeUrl: currentAuthorizeUrl,
        });
      } catch (error) {
        showResult('error', '获取 authorizeUrl 失败: ' + error.message);
      } finally {
        getAuthUrlBtn.disabled = false;
        getAuthUrlBtn.textContent = '获取 authorizeUrl';
      }
    });

    // 打开授权
    openAuthBtn.addEventListener('click', async () => {
      if (!currentAuthorizeUrl) {
        showResult('error', '请先获取 authorizeUrl');
        return;
      }

      if (isAuthorizing) {
        return;
      }

      const mode = document.getElementById('mode').value;
      initSDK(mode);

      isAuthorizing = true;
      openAuthBtn.disabled = true;
      openAuthBtn.textContent = '授权中...';

      try {
        const authResult = await sdk.openAuthorization(currentAuthorizeUrl);

        if (authResult.status === 'success') {
          updateStatus(authStatus, '已授权', 'success');
          authorizeIdEl.textContent = authResult.authorizeId || '-';
          showResult('success', '授权成功！', authResult);
        } else if (authResult.status === 'cancelled') {
          updateStatus(authStatus, '已取消', 'pending');
          showResult('cancelled', '用户取消了授权', authResult);
        } else {
          updateStatus(authStatus, '失败', 'error');
          showResult('error', authResult.error?.message || '授权失败', authResult);
        }
      } catch (error) {
        showResult('error', '授权异常: ' + error.message);
      } finally {
        isAuthorizing = false;
        openAuthBtn.disabled = false;
        openAuthBtn.textContent = '打开授权';
        closeBtn.disabled = true;
      }
    });

    // 关闭授权
    closeBtn.addEventListener('click', () => {
      if (sdk) {
        sdk.closeModal();
        updateStatus(authStatus, '已关闭', 'pending');
      }
    });

    // 页面卸载时清理
    window.addEventListener('beforeunload', () => {
      if (sdk) {
        sdk.destroy();
      }
    });

    console.log('Cregis SDK Demo 已加载');
  </script>
</body>
</html>
