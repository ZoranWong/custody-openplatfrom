components:
  schemas:
    CoinDto:
      type: object
      properties:
        coinId:
          type: string
          description: 币种ID
          default: '##default'
        network:
          type: string
          description: 网络
          default: '##default'
    AccountData:
      type: object
      properties:
        account_name:
          type: string
          description: ''
        account_type:
          type: string
          description: ''
    ProjectUnit:
      type: object
      properties:
        id:
          type: integer
          description: ID
          format: int64
        ecode:
          type: string
          description: 企业code
          default: '##default'
        projectId:
          type: integer
          description: 项目ID
          format: int64
        name:
          type: string
          description: 名字
          default: '##default'
        ubo:
          type: string
          description: 最终受益人的ecode，如果是三方模式，是另外一个企业ID，否则就是自己的企业ID
          default: '##default'
        custodyServiceMode:
          type: string
          description: 托管接入模式
          enum:
            - DEDICATED_ACCOUNT
            - OMNIBUS_ACCOUNT
            - OPEN_API_PROXY
          default: '##default'
        topology:
          type: string
          description: 账户模型
          enum:
            - ORBIT
            - SINGLE_GENERAL
            - CUSTOM
            - QUAD_SMART_ISOLATION
          default: '##default'
        coinIds:
          type: array
          items:
            $ref: '#/components/schemas/CoinDto'
            description: com.cregis.custody.common.dto.trustVault.CoinDto
          description: 币种集合
          default: '##default'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountData'
            description: com.spark.support.wccip.dto.AccountData
          description: 账户列表
          default: '##default'
        businessPurpose:
          type: string
          description: 业务用途
          default: '##default'
        status:
          type: string
          description: ''
          default: Active
        sort:
          type: integer
          description: 排序
        creationType:
          type: string
          description: '创建类型: PLATFORM/THIRD_PARTY'
          enum:
            - PLATFORM
            - THIRD_PARTY
          default: '##default'
        developerId:
          type: string
          description: 三方平台开发者ID
          default: '##default'
        creatorId:
          type: integer
          description: 创建人
          format: int64
        remark:
          type: string
