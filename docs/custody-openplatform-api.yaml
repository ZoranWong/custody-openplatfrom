info:
  title: 默认模块
  description: ''
  version: 1.0.0
tags: []
paths:
  /callback:
    post:
      summary: 回调
      deprecated: false
      description: |-
        1.查询对应订单信息
        2.根据对应订单信息查询对应商户账户信息
        3.更新账户余额,修改订单状态,修改Activity状态
        收款回调:
        企业自身充值,不更新账户余额,不更新订单状态,不更新Activity状态,只创建流水
        企业的客户充值,更新账户余额,更新订单状态,更新Activity状态,创建流水
        1.查询订单
        2.订单不存在,创建订单,不给客户端回调,作为异常订单
        3.订单存在,判断金额,(1)金额小于实际要支付的金额,只改订单的金额,不更新订单状态,不更新Activity状态,不创建流水
        (2) 订单金额等于实际要支付的金额,更新订单的金额,更新订单状态,更新Activity状态,创建流水,给客户端回调
        (3) 订单金额大于实际要支付的金额,更新订单的金额,不给回调
        这里金额不相等的订单都属于异常订单
      tags: []
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustVaultCallbackDto'
              description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult%3F'
              examples:
                '1':
                  summary: 成功示例
                  value:
                    code: 0
                    message: ''
                    data: null
                '2':
                  summary: 成功示例
                  value:
                    code: 0
                    message: ''
                    data: null
      security: []
